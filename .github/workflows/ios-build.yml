name: Build iOS IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Build Local IPA
        run: |
          NODE_PATH=$(which node)
          export EXPO_OFFLINE=1
          
          # Gera o projeto nativo do iOS
          npx expo prebuild --platform ios
          
          # Injeta o Node nas configurações internas
          echo "export NODE_BINARY=$NODE_PATH" > ios/.xcode.env
          echo "export EXPO_OFFLINE=1" >> ios/.xcode.env
          
          # PULO DO GATO: Altera os arquivos do projeto para desativar codesign em TODAS as dependências/pods
          sed -i '' 's/CODE_SIGNING_ALLOWED = YES/CODE_SIGNING_ALLOWED = NO/g' ios/*.xcodeproj/project.pbxproj || true
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES/CODE_SIGNING_REQUIRED = NO/g' ios/*.xcodeproj/project.pbxproj || true
          
          cd ios
          WORKSPACE_NAME=$(ls -d *.xcworkspace | head -n 1)
          SCHEME_NAME=$(basename "$WORKSPACE_NAME" .xcworkspace)
          
          echo "Compilando o esquema: $SCHEME_NAME usando o workspace: $WORKSPACE_NAME"
          
          # Executa o build com todas as travas de validação e empacotamento desligadas
          xcodebuild -workspace "$WORKSPACE_NAME" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            clean build
          
          cd ..
          mkdir -p Payload
          cp -r ios/build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r meu-gerenciador-real.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: meu-gerenciador-ipa
          path: meu-gerenciador-real.ipa
